name: Deploy với Docker chuyên nghiệp

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login vào Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và Push Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/eon-server:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/eon-server:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/eon-server:latest
            sudo docker stop eon-app || true
            sudo docker rm eon-app || true

            sudo docker run -d --name eon-app -p 80:3001 ${{ secrets.DOCKERHUB_USERNAME }}/eon-server:latest
